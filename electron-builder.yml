# Linux packaging (task group L8, design D2/D13). `npm run dist:linux` builds `out/` first.
# Windows (NSIS) and macOS targets belong to later changes.
appId: io.github.alexnakagama.veydr
productName: Veydr
copyright: Copyright © 2026 alexnakagama
directories:
  output: dist
  buildResources: build
# Only the production bundle and package.json are packaged (plus `zod`, the one runtime
# dependency, which electron-builder adds from `dependencies`). `out-probe/` (the network-probe
# test build), `docs/`, `test/`, sources and configuration files are never shipped;
# `test/packaging/package-contents.test.ts` checks the archive.
files:
  - package.json
  - out/**/*
  - '!**/*.map'
asar: true
# No auto-update (a non-goal): without a publish target no update metadata (app-update.yml,
# latest-linux.yml) is generated.
publish: null
# Design D2. Applied by electron-builder with `@electron/fuses` right after packing;
# `test/packaging/fuses.test.ts` reads the wire of the packaged binary.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  executableName: veydr
  icon: build/icons
  category: Development
  synopsis: Local-first supervisor for development commands
  description: Register local projects, start and stop their development commands, and watch their output and listening ports from one window.
  vendor: alexnakagama
  maintainer: alexnakagama <alexnakagama4@gmail.com>
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Electron derives the Wayland app_id / WM_CLASS from package.json `desktopName` (veydr);
  # the .desktop file gets the same name and StartupWMClass so windows match their entry.
  syncDesktopName: true
appImage:
  # electron-builder's default adds --no-sandbox to the AppImage's desktop entry; Veydr never runs
  # without the sandbox (it refuses the option at startup, design D2).
  executableArgs: []
deb:
  # Replaces electron-builder's default list, which lacks libgbm1 and libasound2 (Electron 44 does not
  # start without them; found by scripts/smoke-linux.sh). First: every library the packaged binaries
  # link against (readelf NEEDED; checked by test/packaging/package-contents.test.ts), with the
  # 64-bit time_t names of Debian 13 / Ubuntu 24.04 first. Then electron-builder's defaults, which
  # Electron loads at runtime.
  depends:
    - libasound2t64 | libasound2
    - libatk-bridge2.0-0t64 | libatk-bridge2.0-0
    - libatk1.0-0t64 | libatk1.0-0
    - libatspi2.0-0t64 | libatspi2.0-0
    - libc6
    - libcairo2
    - libcups2t64 | libcups2
    - libdbus-1-3
    - libexpat1
    - libgbm1
    - libgcc-s1
    - libglib2.0-0t64 | libglib2.0-0
    - libgtk-3-0t64 | libgtk-3-0
    - libnspr4
    - libnss3
    - libpango-1.0-0
    - libudev1
    - libx11-6
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxkbcommon0
    - libxrandr2
    - libnotify4
    - libxss1
    - libxtst6
    - xdg-utils
    - libuuid1
    - libsecret-1-0
  # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's sandbox needs; the
  # profile grants them to /opt/Veydr/veydr only (see docs/install-linux.md). electron-builder's
  # post-install script installs it where AppArmor supports it and sets chrome-sandbox's mode.
  appArmorProfile: build/linux/apparmor-profile
