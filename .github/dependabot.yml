# Weekly dependency update pull requests (docs/ci.md#dependabot, design D10). Each one goes through
# ci-ok and dependency review like any other pull request.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Matches min-release-age=7 in .npmrc: npm ci would refuse a version younger than seven days.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Major updates are not grouped, so each gets a pull request of its own.

  - package-ecosystem: github-actions
    # The workflows and the local composite actions, which pin actions of their own.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    # Same delay as npm: a just-published action release is not proposed before it has had a week.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
