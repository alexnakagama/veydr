# Quality gate for pull requests and master (docs/ci.md#ci, design D4). Branch protection requires
# only the aggregate job ci-ok, so jobs can be added or renamed without touching repository settings.
name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  merge_group:

permissions: {}

# A newer push to a pull request cancels the run for its previous commit. Every other run gets a
# group of its own: a shared group would let a newer master push drop an older pending run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
      # The checks are independent, so each runs even if an earlier one failed; the job fails if any does.
      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run lint
      - name: Spec coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run spec-coverage
      - name: Production dependency audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=low
      # rhysd/actionlint 1.7.12, pinned by digest; it lints the workflows with shellcheck.
      - name: Workflow lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: npm test

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          electron: "true"
      - name: Integration tests
        run: xvfb-run --auto-servernum npm run test:integration

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          electron: "true"
      - name: End-to-end tests
        run: xvfb-run --auto-servernum npm run test:e2e
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          electron: "true"
      - name: Build packages and run the packaging tests
        run: xvfb-run --auto-servernum npm run test:packaging
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
          retention-days: 7
          if-no-files-found: error

  # Typecheck, lint, and unit tests on Windows (design D6), so path, case, and line-ending assumptions
  # surface, then the Windows integration tests against the helper built here, and the end-to-end
  # tests against the app built here (add-windows-environment-and-commands design D7). The other
  # integration tests and the packaging tests need Linux and do not run here; unit and end-to-end
  # tests that need a Linux facility are skipped with a stated reason (design D7, docs/ci.md).
  windows:
    name: windows
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On Windows, electron: "true" installs only the dependencies; the e2e step downloads Electron
      # itself (scripts/ensure-electron.cjs), as on a developer's machine.
      - id: setup
        uses: ./.github/actions/setup
        with:
          electron: "true"
      # As in static: each check runs even if an earlier one failed; the job fails if any does. The
      # run steps use the runner's default shell (PowerShell); they only call npm scripts.
      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run lint
      - name: Unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm test
      # The Windows integration tests need the helper, built from source each time (no helper binary
      # is committed). The test step requires the build step's success, so after a failed build no
      # Windows integration test is reported, neither passed nor skipped, and the failed build fails the job.
      - id: helper
        name: Build Windows helper
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/build-windows-helper.mjs
      - name: Windows integration tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.helper.outcome == 'success' }}
        run: npm run test:windows
      # The e2e suite starts commands from the built app, which needs the helper below the
      # repository root (out-helper/), so it too runs only after a successful helper build. Chromium's
      # sandbox stays on, as in the Linux e2e job, which alone runs the offline test.
      - name: Windows end-to-end tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.helper.outcome == 'success' }}
        run: npm run test:e2e
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-e2e-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The one required check. It runs whatever happened to the jobs above and fails unless every one
  # of them succeeded: a plain needs: would let a skipped or cancelled job through.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - static
      - unit
      - integration
      - e2e
      - package
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # Runs on the runner image's own Node (no checkout or setup needed); workflow-policy.test.ts
      # executes this exact script against sample results.
      - name: Require every check to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node <<'EOF'
          const results = Object.entries(JSON.parse(process.env.NEEDS || '{}')).map(([job, need]) => [job, need?.result])
          for (const [job, result] of results) console.log(`${job}: ${result}`)
          const failed = results.filter(([, result]) => result !== 'success').map(([job]) => job)
          if (results.length === 0) {
            console.log('::error title=ci-ok::no checks to aggregate')
            process.exit(1)
          }
          if (failed.length > 0) {
            console.log(`::error title=ci-ok::these checks did not succeed: ${failed.join(', ')}`)
            process.exit(1)
          }
          EOF
