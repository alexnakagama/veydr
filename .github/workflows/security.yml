# Security scanning (docs/ci.md#security, design D1). CodeQL alerts go to the Security tab; the
# master ruleset requires dependency-review, which fails a pull request that adds a vulnerable dependency.
name: Security

on:
  pull_request:
  push:
    branches:
      - master
  # A merge queue needs the required dependency-review check reported for the merge group; the
  # job is skipped there, which counts as passing (it already ran on the pull request).
  merge_group:
  # Mondays 04:00 UTC: a new CodeQL query or advisory is picked up even when nothing is pushed.
  schedule:
    - cron: "0 4 * * 1"

permissions: {}

# Same rule as ci.yml: a newer push to a pull request cancels the run for its previous commit, and
# every other run gets a group of its own.
concurrency:
  group: security-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # JavaScript and TypeScript are analysed from source, so nothing is installed or built.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Compares the dependency graph of the pull request's base and head; it reads the manifests
      # through the API, so no checkout is needed.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
