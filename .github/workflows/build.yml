# Manual package build of any ref (docs/ci.md#manual-builds). It produces the downloadable Linux
# packages and the Windows installer, each set with its SHA256SUMS, as workflow artifacts, and never
# changes the version, pushes, tags or releases.
name: Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (empty for the branch the run is started on)
        required: false
        type: string
        default: ""
      smoke:
        description: Also run the distribution smoke matrix on the built packages
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The commit that was built, so smoke checks out the same one even if the branch moves.
      - name: Record the source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with:
          electron: "true"
      - name: Build packages and run the packaging tests
        run: xvfb-run --auto-servernum npm run test:packaging
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          shopt -s nullglob
          debs=(*.deb)
          appimages=(*.AppImage)
          if [ "${#debs[@]}" -ne 1 ] || [ "${#appimages[@]}" -ne 1 ]; then
            echo "::error title=Unexpected packages::expected one .deb and one AppImage in dist/, found: ${debs[*]} ${appimages[*]}"
            exit 1
          fi
          sha256sum -- "${debs[0]}" "${appimages[0]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

  # The Windows installer of the same ref, with a SHA256SUMS of its own (add-windows-packaging design
  # D6). It runs the same script as ci.yml's windows-package job, so the installer is uploaded only
  # after the Windows packaging tests passed against it. Nothing is signed (design D8).
  windows-package:
    name: windows-package
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # On Windows, electron: "true" installs only the dependencies; dist:windows downloads Electron
      # itself (scripts/ensure-electron.cjs). The npm cache stays on, as for the Linux package job:
      # a manual build is not a release, and only the release turns every cache off.
      - uses: ./.github/actions/setup
        with:
          electron: "true"
      # dist:windows builds the helper from source first, in an && chain: a failed helper build ends
      # the script before electron-builder runs, so no installer is built and the job fails.
      - name: Build the Windows installer and run the Windows packaging tests
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run test:packaging:windows
      # Git for Windows' sha256sum writes binary-mode lines (`*name`), so the GNU text-mode file comes
      # from scripts/sha256sums.mjs, which also verifies what it wrote. Bash, as on Linux: the name
      # check is the same script the policy test runs.
      - name: Write SHA256SUMS
        shell: bash
        run: |
          shopt -s nullglob
          version="$(node -p 'require("./package.json").version')"
          expected="Veydr-$version-x64-setup.exe"
          found=(dist/*.exe)
          if [ "${#found[@]}" -ne 1 ] || [ "${found[0]}" != "dist/$expected" ]; then
            echo "::error title=Unexpected installer::expected exactly $expected in dist/, found: ${found[*]}"
            exit 1
          fi
          node scripts/sha256sums.mjs dist "$expected"
      # The check a Windows user runs (docs/ci.md#manual-builds), independent of the script above.
      - name: Check SHA256SUMS with Get-FileHash
        shell: pwsh
        run: |
          $lines = @(Get-Content -LiteralPath dist/SHA256SUMS)
          if ($lines.Count -ne 1 -or $lines[0] -cnotmatch '^([0-9a-f]{64})  (Veydr-[0-9A-Za-z.-]+-x64-setup\.exe)$') {
            throw "dist/SHA256SUMS is not one line for the installer: $($lines -join ' | ')"
          }
          $expected = $Matches[1]
          $name = $Matches[2]
          $actual = (Get-FileHash -LiteralPath (Join-Path dist $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Get-FileHash gives $actual for $name, SHA256SUMS has $expected" }
          "${name}: OK ($actual)"
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package
          path: |
            dist/*-x64-setup.exe
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Tests the packages the package job uploaded, not a rebuild.
  smoke:
    name: smoke
    needs:
      - package
    if: inputs.smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.sha }}
          persist-credentials: false
      # The containers run the packages with user namespaces allowed, which the runner's AppArmor
      # restriction also blocks inside Docker.
      - uses: ./.github/actions/setup
        with:
          electron: "true"
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: dist
      - name: Check the downloaded packages
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Distribution smoke matrix
        run: scripts/smoke-linux.sh
      - name: Upload smoke results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-linux
          path: test-results/smoke-linux/
          retention-days: 14
          if-no-files-found: ignore
