# Runner setup shared by every job (docs/ci.md, design D2). Call it after actions/checkout.
name: Setup
description: Node from .nvmrc, the pinned npm, npm ci, caches, and optionally what Electron needs.

inputs:
  electron:
    description: "'true' adds Xvfb and enables unprivileged user namespaces for Chromium's sandbox (design D3)."
    required: false
    default: "false"
  cache:
    description: "'false' turns off the npm, Electron and electron-builder caches (the release, design D8)."
    required: false
    default: "true"
  dependencies:
    description: "'false' skips npm ci, for a job that needs only Node and npm (the release publish job, which holds a write token)."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        ELECTRON: ${{ inputs.electron }}
        CACHE: ${{ inputs.cache }}
        DEPENDENCIES: ${{ inputs.dependencies }}
      run: |
        if [ "$ELECTRON" = true ] && [ "$DEPENDENCIES" = false ]; then
          echo "::error title=Invalid setup input::electron: 'true' needs the dependencies; do not combine it with dependencies: 'false'"
          exit 1
        fi
        for pair in "electron=$ELECTRON" "cache=$CACHE" "dependencies=$DEPENDENCIES"; do
          case "${pair#*=}" in
            true | false) ;;
            *)
              echo "::error title=Invalid setup input::${pair%%=*} must be 'true' or 'false', got '${pair#*=}'"
              exit 1
              ;;
          esac
        done

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}
        package-manager-cache: ${{ inputs.cache }}

    # The npm docs/dependencies.md was verified with; whatever npm the runner's Node ships is not
    # trusted to enforce allowScripts. This is the only place the version is set.
    - name: Install npm 11.19.0
      shell: bash
      env:
        NPM_VERSION: 11.19.0
      run: |
        npm install --global --no-audit --no-fund "npm@$NPM_VERSION"
        actual="$(npm --version)"
        if [ "$actual" != "$NPM_VERSION" ]; then
          echo "::error title=Wrong npm version::expected npm $NPM_VERSION, got $actual"
          exit 1
        fi

    - name: Cache Electron and electron-builder downloads
      if: inputs.cache == 'true' && inputs.dependencies == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
        key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: inputs.dependencies == 'true'
      shell: bash
      run: npm ci

    - name: Install Xvfb
      if: inputs.electron == 'true'
      shell: bash
      run: |
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends xvfb

    # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which breaks Chromium's
    # sandbox and the offline test. Lift the restriction instead of weakening either (design D3).
    - name: Enable unprivileged user namespaces
      if: inputs.electron == 'true'
      shell: bash
      run: |
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        if ! unshare --user true; then
          echo "::error title=User namespaces unavailable::'unshare --user true' failed after setup. Chromium's sandbox needs unprivileged user namespaces; check the runner image's AppArmor and sysctl defaults (docs/ci.md)."
          exit 1
        fi
        if ! unshare --user --map-root-user --net true; then
          echo "::error title=Network namespaces unavailable::'unshare --user --map-root-user --net true' failed after setup. test/e2e/offline.spec.ts needs it (docs/ci.md)."
          exit 1
        fi

    # The runner pipes core dumps to systemd-coredump, even for Chromium's non-dumpable sandboxed
    # processes. A crashing process stays in exit until its core is written, so Electron learns of a
    # crashed renderer only much later. Nothing collects dumps on a runner; turn them off.
    - name: Disable core dumps
      if: inputs.electron == 'true'
      shell: bash
      run: |
        sudo sysctl -w fs.suid_dumpable=0 'kernel.core_pattern=|/bin/false'
